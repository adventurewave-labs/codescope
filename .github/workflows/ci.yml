name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Diagnostic: a bare job with no marketplace actions and no checkout. If this
  # passes but `test` fails, the issue is action/checkout resolution; if this
  # also fails, GitHub-hosted runners aren't usable in this environment.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo "runner ok"

  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships a stable Rust toolchain; just ensure the components
      # we need are present (avoids third-party toolchain/cache actions).
      - name: Prepare toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version && cargo --version

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features
