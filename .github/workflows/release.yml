name: Release

# Build prebuilt `codescope` binaries for Linux / macOS / Windows and publish
# them to a GitHub Release when a version tag is pushed (ADR-0022).
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# First-party actions + the preinstalled `gh` CLI only (same policy as ci.yml).

on:
  push:
    tags: ["v*"]
  # Dry run: any PR touching the release pipeline or the build inputs runs
  # verify + the full 5-target build + smoke tests, but never publishes.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.3.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt + clippy + test + eval gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: scripts/eval --check

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  archive: tar.gz, run: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, archive: tar.gz, run: true }
          - { os: macos-14,         target: aarch64-apple-darwin,       archive: tar.gz, run: true }
          # Intel macOS runners are being retired: cross-compile on Apple
          # silicon; the smoke step verifies the Mach-O arch instead of running.
          - { os: macos-14,         target: x86_64-apple-darwin,        archive: tar.gz, run: false }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     archive: zip,    run: true }
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *musl ]]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          fi

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/codescope
          [[ -f "$bin.exe" ]] && bin="$bin.exe"
          if [[ "${{ matrix.run }}" == "true" ]]; then
            "$bin" --version
            "$bin" -p . index
            "$bin" -p . find "parse unified diff" --max-tokens 200 | tee find.out
            grep -q parse_unified_diff find.out
          else
            file "$bin"
            file "$bin" | grep -q "x86_64"
          fi

      - name: Package
        id: pkg
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || (github.event_name == 'pull_request' && 'dryrun') || github.ref_name }}"
          name="codescope-${ref}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp target/${{ matrix.target }}/release/codescope.exe "dist/$name/"
          else
            cp target/${{ matrix.target }}/release/codescope "dist/$name/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ steps.pkg.outputs.archive }}
            dist/${{ steps.pkg.outputs.archive }}.sha256

  publish:
    name: publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ls -l dist
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            # Tags with a suffix (v0.3.0-rc.1) publish as pre-releases.
            pre=""
            [[ "$tag" == *-* ]] && pre="--prerelease"
            gh release create "$tag" dist/* --title "codescope $tag" --generate-notes $pre
          fi
